# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: build-push
on:
  workflow_call:
    inputs:
      image_tag:
        description: Exact commit to build and publish
        required: true
        type: string

permissions: {}

jobs:
  frontend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-fe.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
  backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-one.yml
    with:
      service: backend
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
  worker:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-one.yml
    with:
      service: worker
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
