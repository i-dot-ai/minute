# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: Checks

env:
  DOCKER_BUILDKIT: 1

on:
  pull_request:
  push:
    paths:
      - backend/**
      - common/**
      - worker/**
      - temporal/**
      - temporal-admin/**
      - tests/**
      - alembic/**
      - frontend/**
      - conftest.py
      - pyproject.toml
      - uv.lock
      - .env.example
      - Makefile
      - docker-compose.yaml
      - ministack-setup.sh
      - .dockerignore
      - .github/workflows/**
      - .github/scripts/**
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --no-install-project --no-default-groups --group dev

      - name: Format code
        run: |
          uv run ruff format . --check
          uv run ruff check .

  run_tests:
    name: Run tests

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Copy env file
        run: |
          cp .env.example .env

      - name: Verify FFmpeg is available for audio tests
        run: ffmpeg -version

      # backend.main builds a queue service and resolves the SQS queue URL at
      # import time, and the auth dependency hits postgres, so the suite cannot
      # be collected without these two running.
      - name: Start postgres and MiniStack
        run: |
          docker compose up -d --wait db ministack

      - name: Run database migrations
        run: |
          uv run alembic upgrade head

      - name: Run tests
        run: |
          make test

      - name: Stop postgres and MiniStack
        if: always()
        run: |
          docker compose logs db ministack
          docker compose down -v

  local_build:
    name: Local container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Validate and build local services without publishing
        run: |
          set -a
          source temporal/version.env
          set +a
          docker compose config --quiet
          docker compose build
      - name: Build production frontend without publishing
        run: docker build -f frontend/Dockerfile .
      - name: Verify non-root runtime permissions
        run: |
          for service in backend worker; do
            docker compose run --rm --no-deps -T --entrypoint python "$service" -c '
          import os
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          assert os.getuid() != 0
          assert Path("/app/.venv/bin/python").is_file()
          assert Path("/app/.venv").stat().st_uid == 0
          assert Path("/app/common/settings.py").read_text()
          for parent in ("/app/config", "/app/common", f"/app/{sys.argv[1]}"):
              with TemporaryDirectory(dir=parent) as directory:
                  Path(directory, "permission-check").write_text("{}")
          ' "$service"
          done
