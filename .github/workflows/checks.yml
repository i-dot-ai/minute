# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: Checks

env:
  DOCKER_BUILDKIT: 1

on:
  push:
    paths:
      - backend/**
      - Makefile
      - frontend/**
    branches:
      - "main"
      - "feature/**"
      - "chore/**"
      - "bugfix/**"
      - "hotfix/**"
      - "develop"
      - "dependabot/**"
      - "security/**"
  workflow_dispatch:

jobs:
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --no-install-project --no-default-groups --group dev

      - name: Format code
        run: |
          uv run ruff format . --check
          uv run ruff check .

  run_tests:
    name: Run tests

    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Copy env file
        run: |
          cp .env.example .env

      - name: Run tests
        run: |
          make test

#
