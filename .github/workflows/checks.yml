# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: Checks

env:
  DOCKER_BUILDKIT: 1

on:
  push:
    paths:
      - backend/**
      - common/**
      - worker/**
      - tests/**
      - alembic/**
      - frontend/**
      - conftest.py
      - pyproject.toml
      - uv.lock
      - .env.example
      - Makefile
      - .github/workflows/checks.yml
    branches:
      - "main"
      - "feature/**"
      - "chore/**"
      - "bugfix/**"
      - "hotfix/**"
      - "develop"
      - "dependabot/**"
      - "security/**"
  workflow_dispatch:

jobs:
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --no-install-project --no-default-groups --group dev

      - name: Format code
        run: |
          uv run ruff format . --check
          uv run ruff check .

  run_tests:
    name: Run tests

    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Copy env file
        run: |
          cp .env.example .env

      # backend.main builds a queue service and resolves the SQS queue URL at
      # import time, and the auth dependency hits postgres, so the suite cannot
      # be collected without these two running.
      - name: Start postgres and MiniStack
        run: |
          docker compose up -d --wait db ministack

      - name: Run database migrations
        run: |
          uv run alembic upgrade head

      - name: Run tests
        run: |
          make test

      - name: Stop postgres and MiniStack
        if: always()
        run: |
          docker compose logs db ministack
          docker compose down -v

#
