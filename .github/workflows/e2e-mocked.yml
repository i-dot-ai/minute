name: E2E Mocked

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-mocked:
    name: Mocked E2E (chromium/firefox/webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run mocked E2E
        working-directory: frontend
        env:
          CI: "true"
          ENVIRONMENT: local
          AUTH_API_URL: placeholder
          BACKEND_HOST: http://localhost:8080 # To prevent warnings in the lgos but not actually used
          PW_WEBSERVER_CMD: npm run build && next run start
        run: npm run test:e2e:mocked

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
