# Put action within a raw block so that the curly bracket expressions aren't picked up by the cookiecutter
#
name: release-infrastructure

on:
  push:
    tags:
      - release-dev-**
      - release-preprod-**
      - release-temporal-server-dev-**
      - release-temporal-server-preprod-**
  
  # Move to manual release until we are confident we can handle deploys 
  # during meeting recordings
  workflow_dispatch:
    inputs:
      component:
        description: What to release
        type: choice
        options: [app, temporal-server]
        default: app
      environment:
        description: Deployment environment (production requires main)
        type: choice
        options: [dev, preprod, prod]
        default: dev
      server_upgrade_reviewed:
        description: For production server releases, confirm the supported upgrade path and restore procedure were reviewed
        type: boolean
        default: false

permissions: {}

concurrency:
  group: minute-release-${{ github.event_name == 'workflow_dispatch' && inputs.environment || ((startsWith(github.ref_name, 'release-dev-') || startsWith(github.ref_name, 'release-temporal-server-dev-')) && 'dev' || 'preprod') }}
  cancel-in-progress: false

jobs:
  set-vars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app-name: ${{ steps.export.outputs.app-name }}
      ec2-instance-type: ${{ steps.export.outputs.ec2-instance-type }}
      runner-size: ${{ steps.export.outputs.runner-size }}
      version: ${{ steps.export.outputs.version }}
      repo: ${{ steps.export.outputs.repo }}
      infra-config-repo: ${{ steps.export.outputs.infra-config-repo }}
      environment: ${{ steps.env-var.outputs.environment }}
      ecr-repo: ${{ steps.export.outputs.ecr-repo }}
      infrastructure-folder: ${{ steps.env-var.outputs.infrastructure-folder }}
      component: ${{ steps.env-var.outputs.component }}
      image-tag: ${{ steps.env-var.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: export
        run: |
          . ./.github/.github.env
          echo "ec2-instance-type=${EC2_INSTANCE_TYPE}" >> $GITHUB_OUTPUT
          echo "runner-size=${RUNNER_SIZE}" >> $GITHUB_OUTPUT
          echo "app-name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "aws-region=${AWS_REGION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "data-path=${DATA_PATH}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "infra-config-repo=${INFRA_CONFIG_REPO}" >> $GITHUB_OUTPUT
          echo "ecr-repo=${ECR_REPO}" >> $GITHUB_OUTPUT
          echo "::add-mask::${AWS_REGION}"

      - id: env-var
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          SERVER_UPGRADE_REVIEWED: ${{ inputs.server_upgrade_reviewed }}
        run: |
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            component="$RELEASE_COMPONENT"
            environment="$RELEASE_ENVIRONMENT"
          elif [[ "$RELEASE_REF" == release-temporal-server-* ]]; then
            component=temporal-server
            environment="${RELEASE_REF#release-temporal-server-}"
            environment="${environment%%-*}"
          else
            component=app
            environment="${RELEASE_REF#release-}"
            environment="${environment%%-*}"
          fi
          case "$environment" in dev|preprod|prod) ;; *) exit 1 ;; esac
          if [[ "$environment" == prod && "$RELEASE_REF" != main ]]; then
            echo "Production releases require main" >&2
            exit 1
          fi
          case "$component" in
            app) folder=terraform ;;
            temporal-server) folder=terraform-temporal ;;
            *) exit 1 ;;
          esac
          if [[ "$component" == temporal-server && "$environment" == prod && "$SERVER_UPGRADE_REVIEWED" != true ]]; then
            echo "Review the Temporal upgrade path and restore procedure before a production server release" >&2
            exit 1
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "infrastructure-folder=$folder" >> "$GITHUB_OUTPUT"
          echo "image-tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-temporal:
    needs: set-vars
    if: needs.set-vars.outputs.component == 'temporal-server'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-one.yml
    with:
      service: temporal
    secrets: inherit

  build-temporal-admin:
    needs: set-vars
    if: needs.set-vars.outputs.component == 'temporal-server'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-one.yml
    with:
      service: temporal-admin
    secrets: inherit

  start-runner:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/start-runner.yml@main
    needs: set-vars
    permissions:
      id-token: write
    with:
      EC2_INSTANCE_TYPE: ${{ needs.set-vars.outputs.ec2-instance-type }}
      RUNNER_SIZE: ${{ needs.set-vars.outputs.runner-size }}
      ENVIRONMENT: ${{ needs.set-vars.outputs.environment }}
      USE_OIDC: true
    secrets:
      AWS_GITHUBRUNNER_USER_ACCESS_KEY: ${{ secrets.AWS_GITHUBRUNNER_USER_ACCESS_KEY }}
      AWS_GITHUBRUNNER_USER_SECRET_ID: ${{ secrets.AWS_GITHUBRUNNER_USER_SECRET_ID }}
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT}}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  apply-infra:
    if: ${{ !cancelled() && needs.set-vars.result == 'success' && needs.start-runner.result == 'success' && (needs.build-temporal.result == 'success' || needs.build-temporal.result == 'skipped') && (needs.build-temporal-admin.result == 'success' || needs.build-temporal-admin.result == 'skipped') }}
    needs:
      - set-vars
      - start-runner
      - build-temporal
      - build-temporal-admin
    permissions:
      id-token: write
      contents: read
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/apply-terraform.yml@main
    with:
      APP_NAME: ${{ needs.set-vars.outputs.app-name }}
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      ENVIRONMENT: ${{ needs.set-vars.outputs.environment }}
      ECR_REPO: ${{ needs.set-vars.outputs.component == 'temporal-server' && 'minute-temporal' || needs.set-vars.outputs.ecr-repo }}
      INFRASTRUCTURE_FOLDER: ${{ needs.set-vars.outputs.infrastructure-folder }}
      TF_FILE: main/${{ needs.set-vars.outputs.infrastructure-folder }}/provider.tf
      PUBLIC_INFRA_DEPLOYMENT: false
      IMAGE_TAG: ${{ needs.set-vars.outputs.image-tag }}
      USE_OIDC: true
    secrets:
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_GITHUBRUNNER_PAT_USER: ${{ secrets.AWS_GITHUBRUNNER_PAT_USER }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  notify-slack:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/slack-notify.yml@main
    permissions: {}
    needs:
      - set-vars
      - start-runner
      - apply-infra
    with:
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      WORKFLOW_PASSED: "${{ needs.apply-infra.result  == 'success' }}"
      SUCCESS_PAYLOAD: '{"blocks":[{"type":"header","text":{"type":"plain_text","text":":airplane: ${{ github.repository }} - Deployment to ${{ needs.set-vars.outputs.environment }} Succeeded :large_green_circle:"}},{"type":"section","text":{"type":"mrkdwn","text":"${{ github.sha }} successfully deployed to ${{ needs.set-vars.outputs.environment }}"}}]}'
      FAILURE_PAYLOAD: '{"blocks":[{"type":"header","text":{"type":"plain_text","text":":x: ${{ github.repository }} - Deployment to ${{ needs.set-vars.outputs.environment }} Failed :x:"}},{"type":"section","text":{"type":"mrkdwn","text":"${{ github.sha }} failed to deploy to ${{ needs.set-vars.outputs.environment }}"}}]}'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  stop-runner:
    needs:
      - set-vars
      - start-runner
      - apply-infra
      - notify-slack
    permissions:
      id-token: write
      contents: read
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/stop-runner.yml@main
    if: needs.start-runner.outputs.use-persisted == 0 && always()
    with:
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      EC2_INSTANCE_ID: ${{ needs.start-runner.outputs.ec2-instance-id }}
      ENVIRONMENT: ${{ needs.set-vars.outputs.environment }}
      USE_OIDC: true
    secrets:
      AWS_GITHUBRUNNER_USER_ACCESS_KEY: ${{ secrets.AWS_GITHUBRUNNER_USER_ACCESS_KEY }}
      AWS_GITHUBRUNNER_USER_SECRET_ID: ${{ secrets.AWS_GITHUBRUNNER_USER_SECRET_ID }}
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
#
