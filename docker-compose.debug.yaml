# This is to run the Temporal worker under debugpy so we can attach an IDE and step through the pipeline.
# Spin it up in debug mode via docker compose -f docker-compose.yaml -f docker-compose.debug.yaml up --build
# The worker waits for a debugger on localhost:5678 before it starts polling Temporal.
services:
  worker:
    ports:
      - "5678:5678"
    environment:
      # Disables the workflow deadlock detector, which would otherwise fail a workflow task paused at a breakpoint.
      - TEMPORAL_DEBUG=1
    volumes:
      # Run the code on the host so breakpoints match what you're editing.
      - ./common:/app/common
      - ./worker:/app/worker
    command:
      - bash
      - -c
      # Same credential setup as worker/entrypoint.sh, which also carries on if the credentials are
      # missing or invalid (only the LLM steps need them), then the worker under debugpy.
      - >-
        mkdir -p /app/config;
        echo "$$GOOGLE_APPLICATION_CREDENTIALS_BASE64" | base64 -d > /app/config/google-credentials.json
        || echo "GOOGLE_APPLICATION_CREDENTIALS_BASE64 is not valid base64; LLM steps will fail";
        export GOOGLE_APPLICATION_CREDENTIALS=/app/config/google-credentials.json;
        uv pip install --python /app/.venv/bin/python debugpy &&
        exec python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 --wait-for-client worker/temporal_worker.py
