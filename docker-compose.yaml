services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.data
        target: /static
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/healthcheck"]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 5s
    develop:
      watch:
        - path: ./backend
          target: /app/backend
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  worker: # Temporal worker: transcription + minute generation + AI edits
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    deploy: # Make sure the worker has a couple of CPUS
      resources:
        limits:
          cpus: "2.0" # Set CPU limit to 2 cores
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./.data
        target: /static
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - TEMPORAL_ADDRESS=temporal:7233
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
      temporal:
        condition: service_healthy
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  temporal:
    # Temporal CLI dev server: SQLite-backed, UI on http://localhost:8233
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      retries: 20
      start_period: 5s
      timeout: 5s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
      args:
        - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
        - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_HOST=http://backend:8080
      - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
      - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    volumes:
      - next_data:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
      timeout: 5s
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
        - path: ./frontend/package.json
          action: rebuild

  db:
    image: postgres:13
    user: postgres
    env_file:
      - .env
    volumes:
      - local_postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "minute_db"]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s

  ministack: # MiniStack container (LocalStack-compatible AWS emulator)
    image: ministackorg/ministack:latest
    env_file:
      - .env
    ports:
      - 4566:4566
    volumes:
      # Here you mount your setup file so it will be executed
      # when the container starts
      - ./ministack-setup.sh:/etc/localstack/init/ready.d/script.sh
    environment:
      - AWS_DEFAULT_REGION=eu-west-2
    healthcheck:
      test: ["CMD", "test", "-f", "/ready.txt"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  local_postgres_data: {}
  next_data: {}
  temporal-data: {}
