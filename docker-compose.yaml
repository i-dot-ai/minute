services:
  # Local Sentry UI. The app/worker SDKs stream envelopes here (SENTRY_SPOTLIGHT)
  # when ENVIRONMENT=local, so you can inspect traces, performance and errors in
  # the browser at http://localhost:8969 with no Sentry account and nothing
  # leaving your machine.
  spotlight:
    image: ghcr.io/getsentry/spotlight:latest
    ports:
      - "8969:8969"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - SENTRY_SPOTLIGHT=http://spotlight:8969/stream
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.data
        target: /static
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/healthcheck" ]
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 5s
    develop:
      watch:
        - path: ./backend
          target: /app/backend
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  audio_worker:
    build:
      context: .
      dockerfile: ./workers/audio/Dockerfile
    env_file:
      - .env
    volumes:
      - ${WORKER_TMP:-./.worker-tmp}:/tmp
      - type: bind
        source: ./.data
        target: /static
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - SENTRY_SPOTLIGHT=http://spotlight:8969/stream
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python workers/healthcheck.py" ]
      interval: 60s
      retries: 3
      start_period: 60s
      timeout: 5s
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  worker_transcription:
    build:
      context: .
      dockerfile: ./workers/transcription/Dockerfile
    env_file:
      - .env
    volumes:
      - ${WORKER_TMP:-./.worker-tmp}:/tmp
      - type: bind
        source: ./.data
        target: /static
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - SENTRY_SPOTLIGHT=http://spotlight:8969/stream
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python workers/healthcheck.py" ]
      interval: 60s
      retries: 3
      start_period: 60s
      timeout: 5s
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  worker_summary:
    build:
      context: .
      dockerfile: ./workers/summary/Dockerfile
    env_file:
      - .env
    volumes:
      - ${WORKER_TMP:-./.worker-tmp}:/tmp
      - type: bind
        source: ./.data
        target: /static
    environment:
      - POSTGRES_HOST=db
      - MINISTACK_URL=http://ministack:4566
      - STORAGE_SERVICE_NAME=local
      - LOCAL_STORAGE_PATH=/static
      - SENTRY_SPOTLIGHT=http://spotlight:8969/stream
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python workers/healthcheck.py" ]
      interval: 60s
      retries: 3
      start_period: 60s
      timeout: 5s
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./common
          target: /app/common
          action: sync+restart
        - path: ./uv.lock
          action: rebuild

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
      args:
        - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
        - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_HOST=http://backend:8080
      - NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
      - NEXT_PUBLIC_POSTHOG_API_KEY=$POSTHOG_API_KEY
    volumes:
      - next_data:/app/.next
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
        - path: ./frontend/package.json
          action: rebuild

  db:
    image: postgres:13
    user: postgres
    env_file:
      - .env
    volumes:
      - local_postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "minute_db" ]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s

  ministack:
    # MiniStack container (LocalStack-compatible AWS emulator)
    image: ministackorg/ministack:latest
    env_file:
      - .env
    ports:
      - 4566:4566
    volumes:
      # Here you mount your setup file so it will be executed
      # when the container starts
      - ./ministack-setup.sh:/etc/localstack/init/ready.d/script.sh
    environment:
      - AWS_DEFAULT_REGION=eu-west-2
    healthcheck:
      test: [ "CMD", "test", "-f", "/ready.txt" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  local_postgres_data: {}
  next_data: {}
