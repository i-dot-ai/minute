  <!-- Pair 5 -->
  <rect x="58"  y="60" width="3" height="40" rx="1.5" fill="rgba(255,255,255,0.38)"/>
  <rect x="199" y="60" width="3" height="40" rx="1.5" fill="rgba(255,255,255,0.38)"/>

  <!-- Pair 6 -->
  <rect x="70"  y="44" width="3" height="72" rx="1.5" fill="rgba(255,255,255,0.48)"/>
  <rect x="187" y="44" width="3" height="72" rx="1.5" fill="rgba(255,255,255,0.48)"/>

  <!-- Pair 7 -->
  <rect x="82"  y="55" width="3" height="50" rx="1.5" fill="rgba(255,255,255,0.55)"/>
  <rect x="175" y="55" width="3" height="50" rx="1.5" fill="rgba(255,255,255,0.55)"/>

  <!-- Pair 8 -->
  <rect x="94"  y="36" width="3" height="88" rx="1.5" fill="rgba(255,255,255,0.65)"/>
  <rect x="163" y="36" width="3" height="88" rx="1.5" fill="rgba(255,255,255,0.65)"/>

  <!-- Pair 9 -->
  <rect x="106" y="48" width="3" height="64" rx="1.5" fill="rgba(255,255,255,0.75)"/>
