  <!-- Pair 3 -->
  <rect x="34"  y="58" width="3" height="44" rx="1.5" fill="rgba(255,255,255,0.25)"/>
  <rect x="223" y="58" width="3" height="44" rx="1.5" fill="rgba(255,255,255,0.25)"/>

  <!-- Pair 4 -->
  <rect x="46"  y="52" width="3" height="56" rx="1.5" fill="rgba(255,255,255,0.32)"/>
