  <!-- Pair 10 -->
  <rect x="118" y="22" width="3" height="116" rx="1.5" fill="rgba(255,255,255,0.88)"/>
  <rect x="139" y="22" width="3" height="116" rx="1.5" fill="rgba(255,255,255,0.88)"/>

  <!-- Centre peak — full opacity, dominant -->
  <rect x="128.5" y="12" width="3" height="136" rx="1.5" fill="rgba(255,255,255,1)"/>

</svg>
