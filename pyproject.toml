[project]
name = "minute"
version = "2.0.0"
authors = [{ name = "i.AI", email = "i-dot-ai-enquiries@cabinetoffice.gov.uk" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=44.0.2,<45",
    "pydantic-settings==2.14.2",
    "alembic>=1.13.3,<2",
    "sqlmodel>=0.0.27,<0.0.28",
    "tenacity>=9.1.2,<10",
    "aioboto3>=14.3.0,<15",
    "breame>=0.1.2,<0.2",
    "mistune>=3.1.3,<4",
    "httpx>=0.28.1,<0.29",
    "psycopg2-binary>=2.9.9,<3",
    "boto3>=1.35.3,<2",
    "fastapi>=0.112.0",
    "sentry-sdk[fastapi]>=2.18.0,<3",
    "sqlalchemy[asyncio]>=2.0.42,<3",
    "asyncpg>=0.30.0,<0.31",
    "markdownify>=1.2.0,<2",
    "python-multipart>=0.0.20,<0.0.21",
    "i-dot-ai-utilities>=0.4.4,<0.5",
    "azure-servicebus>=7.14.2,<8",
    "starlette==0.50.0+aikido.3",
    "anyio==4.14.2",
    "aiohttp==3.14.3",
    "mako==1.3.12",
    "urllib3==2.7.0",
    "yarl==1.24.5",
    "python-dotenv==1.2.2",
    "idna==3.15",
    "greenlet==3.5.4",
]

[tool.ruff]
line-length = 120
target-version = 'py312'
fix = true

[dependency-groups]
backend = [
    "pyjwt>=2.9.0,<3",
    "posthog>=6.6.1,<7",
    "uvicorn>=0.31.0,<0.32",
    "apscheduler>=3.11.0,<4",
]
worker = [
    "google-genai>=1.10.0,<2",
    "openai>=1.42.0,<2",
    "ffmpeg-python>=0.2.0,<0.3",
    "ray[default]>=2.53.0,<3",
    "azure-storage-blob>=12.26.0,<13",
    "azure-identity>=1.23.1,<2",
]
dev = [
    "bumpversion>=0.6.0,<0.7",
    "pre-commit>=3.8.0,<4",
    "pytest>=8.3.2,<9",
    "pytest-env>=1.1.1,<2",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=5.0.0,<6",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=0.23.8,<0.24",
    "ruff==0.8.2",
    "bandit>=1.7.9,<2",
    "detect-secrets>=1.5.0,<2",
    "playwright>=1.45,<2",
    "pytest-playwright>=0.5,<0.6",
    "diagrams>=0.23.4,<0.24",
    "ipykernel>=6.29.5,<7",
    "beautifulsoup4>=4.13.3,<5",
]

[tool.cruft]
skip = [
    # general_paths
    ".env.*",
    "data",
]

[[tool.uv.index]]
name = "aikido-pypi-repo"
url = "https://pypi.aikido.io/97f0f5b2fc3054b55dd9"
explicit = true

[tool.uv]
default-groups = "all"

[tool.uv.sources]
starlette = { index = "aikido-pypi-repo" }
anyio = { index = "aikido-pypi-repo" }
aiohttp = { index = "aikido-pypi-repo" }
mako = { index = "aikido-pypi-repo" }
urllib3 = { index = "aikido-pypi-repo" }
yarl = { index = "aikido-pypi-repo" }
python-dotenv = { index = "aikido-pypi-repo" }
pydantic-settings = { index = "aikido-pypi-repo" }
idna = { index = "aikido-pypi-repo" }
greenlet = { index = "aikido-pypi-repo" }

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[tool.hatch.build.targets.sdist]
include = [
    "worker",
    "backend",
    "common",
]

[tool.hatch.build.targets.wheel]
include = [
    "worker",
    "backend",
    "common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.format]
exclude = ["data/*"]

[tool.ruff.lint]
select = [
    "A", "B", "C", "E", "F", "G", "I", "N", "Q", "S", "T", "W",
    "ARG", "ASYNC", "BLE", "COM", "DJ", "DTZ", "EM", "EXE", "FURB",
    "ICN", "INT", "ISC", "LOG", "NPY", "PD", "PGH", "PIE", "PL",
    "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT",
    "TCH", "TD", "TID", "UP", "YTT"
]
exclude = ["out/*", "alembic/versions/*"]
ignore = ["COM812", "DJ001", "RET505", "RET508", "PLR0913", "S318","ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003", "S311"]
"*/tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003"]
"*/tests_playwright/*" = ["S101", "S106", "PLR0913", "PLR2004", "TD003"]
